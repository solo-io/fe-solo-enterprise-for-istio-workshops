# Lab 009: workloads that measure each east-west path in cluster1.
# Every client and server is a fortio pod, so every path serves the same /echo handler.
#   fortio-client          in the mesh, sends the test load
#   fortio-client-nomesh   out of the mesh, baseline client
#   echo                   in the mesh, the target for the L4, waypoint, ingress and bypass paths
#   echo-nomesh            out of the mesh, baseline target
apiVersion: v1
kind: Namespace
metadata:
  name: perf
  labels:
    istio.io/dataplane-mode: ambient
---
# Waypoint for the echo-l7 Service only. The namespace is not labelled to use it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: perf
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-client
  namespace: perf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio-client
  template:
    metadata:
      labels:
        app: fortio-client
    spec:
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-http-port", "8080"]
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-client-nomesh
  namespace: perf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio-client-nomesh
  template:
    metadata:
      labels:
        app: fortio-client-nomesh
        # Out of the mesh: the baseline path with no ztunnel
        istio.io/dataplane-mode: none
    spec:
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-http-port", "8080"]
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: perf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-http-port", "8080"]
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-nomesh
  namespace: perf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-nomesh
  template:
    metadata:
      labels:
        app: echo-nomesh
        # Out of the mesh: the baseline path with no ztunnel
        istio.io/dataplane-mode: none
    spec:
      containers:
      - name: fortio
        image: fortio/fortio:1.75.3
        args: ["server", "-http-port", "8080"]
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: perf
spec:
  selector:
    app: echo
  ports:
  - name: http
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo-l7
  namespace: perf
  labels:
    # Requests to this Service go through the perf waypoint
    istio.io/use-waypoint: waypoint
spec:
  selector:
    app: echo
  ports:
  - name: http
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo-nomesh
  namespace: perf
spec:
  selector:
    app: echo-nomesh
  ports:
  - name: http
    port: 8080
---
# Hairpin path: an in-mesh client calls the ingress gateway, which routes back into the mesh.
# This stands in for internal traffic that is sent through a central gateway today.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: echo
  namespace: perf
spec:
  parentRefs:
  - name: ingress
    namespace: istio-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /echo
    backendRefs:
    - name: echo
      port: 8080
