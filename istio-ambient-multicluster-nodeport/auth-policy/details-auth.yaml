# Allows ns/bookinfo-frontends/sa/bookinfo-productpage from either cluster.
# The trust domains are listed explicitly instead of "*/ns/...", so an identity
# from any other trust domain that shares the root CA is still denied.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: details-auth
  namespace: bookinfo-backends
spec:
  selector:
    matchLabels:
      app: details
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - cluster1.local/ns/bookinfo-frontends/sa/bookinfo-productpage
        - cluster2.local/ns/bookinfo-frontends/sa/bookinfo-productpage
