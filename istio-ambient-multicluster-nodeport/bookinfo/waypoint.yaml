# Waypoint for the bookinfo-backends namespace (labs 009 and 019).
# Label the namespace with istio.io/use-waypoint=waypoint to send its services through it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: bookinfo-backends
spec:
  gatewayClassName: istio-waypoint
  listeners:
  - name: mesh
    port: 15008
    protocol: HBONE
    allowedRoutes:
      namespaces:
        from: All
